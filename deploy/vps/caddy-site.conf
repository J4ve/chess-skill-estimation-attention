# Site block appended to the host's existing /etc/caddy/Caddyfile.
#
# The reverse proxy on this host is Caddy, and it is shared with another
# application. That application's own site blocks are left exactly as they were:
# a named site is more specific than a catch-all, so only this host name is
# routed to the prototype and every other name keeps falling through to the
# blocks that were already there. Caddy obtains the certificate for this name by
# itself, so no certificate handling is duplicated here.
#
# NOT DURABLE: on the current host that Caddyfile is generated by the other
# application's deploy script, so the next run of that script rewrites the file
# and drops this block, and the prototype stops answering on this name until the
# block is added back. Nothing above this block is modified, so a regeneration
# cannot break the other application.

161-118-236-156.sslip.io, ratingnet.ddns.net {
	encode zstd gzip

	# The app reads an uploaded PGN fully into memory. A single game is a few
	# kilobytes, so this is generous while still bounding the request.
	request_body {
		max_size 2MB
	}

	header -Server

	# Live mode is Server-Sent Events: one response stays open for the length of
	# a game and emits a per-ply update as each move arrives. flush_interval -1
	# turns off response buffering so an update reaches the browser when it is
	# produced rather than when a buffer happens to fill.
	reverse_proxy 127.0.0.1:8001 {
		flush_interval -1
	}
}
